<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="arcanum-display auth-card__title">Welcome back</h1>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
    </mat-form-field>

    <a class="auth-card__forgot" routerLink="/forgot-password">Forgot password?</a>

    @if (error()) {
      <p class="auth-card__error">{{ error() }}</p>
    }

    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Log in
      }
    </button>

    <p class="auth-card__switch">
      New here? <a routerLink="/register">Create an account</a>
    </p>
  </form>
</div>
