<div class="auth-page">
  <div class="auth-card">
    @if (submitted()) {
      <h1 class="arcanum-display auth-card__title">Check your email</h1>
      <p class="auth-card__text">
        If that email is registered, we've sent a link to reset your password.
      </p>
      <a mat-flat-button color="primary" routerLink="/login">Back to log in</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <h1 class="arcanum-display auth-card__title">Reset your password</h1>
        <p class="auth-card__text">
          Enter the email on your account and we'll send you a reset link.
        </p>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || submitting()">
          @if (submitting()) {
            <mat-spinner diameter="20" />
          } @else {
            Send reset link
          }
        </button>

        <p class="auth-card__switch">
          <a routerLink="/login">Back to log in</a>
        </p>
      </form>
    }
  </div>
</div>
